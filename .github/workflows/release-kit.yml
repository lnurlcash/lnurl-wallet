name: Release @lnurlcash/kit

on:
  push:
    # The wallet and its embedded kit share one version and one source commit.
    # A vX.Y.Z tag deploys the wallet and publishes kit X.Y.Z.
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Shared wallet and package tag, for example v0.14.0
        type: string
        required: true
      publish:
        description: Publish to npm after validation
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: release-lnurlcash-kit-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # A wallet tag pushes here unconditionally (same tag drives deploy.yml),
  # but most wallet releases never touch src/lib at all - publishing an
  # unchanged tarball under a new version number every time would be noise,
  # not a real release. This job is the sole gate: everything below only
  # runs when src/lib actually differs from the last plain vX.Y.Z tag.
  # deploy.yml's own release job runs the same comparison independently (no
  # data passed between the two separately-triggered workflows) to note the
  # same outcome on the wallet's GitHub Release.
  check-changed:
    if: startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Has src/lib changed since the last plain release tag?
        id: diff
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # "the last release" = the plain vX.Y.Z tag immediately BEFORE
          # this one in version order - walking the sorted list to find
          # RELEASE_TAG's own neighbour (rather than just the newest tag
          # that isn't RELEASE_TAG) matters for a workflow_dispatch re-run
          # against an older tag after newer ones already exist: that must
          # still compare against ITS OWN predecessor, not skip past every
          # tag released since. Deliberately excludes anything with a
          # prerelease/build suffix ('v*.*.*' itself would also match
          # v0.14.0-rc.0), so a one-time bootstrap prerelease is never the
          # comparison point. No prior plain tag at all (a first-ever
          # release, or RELEASE_TAG itself isn't a plain vX.Y.Z tag) always
          # counts as changed - there's nothing to diff.
          mapfile -t tags < <(git tag --list 'v*.*.*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          previous_tag=""
          found_current=false
          for t in "${tags[@]}"; do
            if [[ "$found_current" == true ]]; then
              previous_tag="$t"
              break
            fi
            [[ "$t" == "$RELEASE_TAG" ]] && found_current=true
          done
          if [[ -z "$previous_tag" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$previous_tag" HEAD -- src/lib; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-changed
    if: needs.check-changed.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - name: Checkout package tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Package tags must point to a commit on origin/main"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org

      - name: Derive and set the package version from the release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        working-directory: src/lib
        run: |
          set -euo pipefail
          # The tag is the sole source of truth for what gets published -
          # same "cutting a release is just tagging a commit" model the
          # wallet's own displayed version already uses
          # (scripts/git-version.mjs), applied here to package.json's
          # version field instead of a JS runtime string. There's no
          # separate "remember to also bump package.json in a PR first"
          # step to forget (see RELEASING.md) - npm itself rejects
          # anything that isn't a valid semver.
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install package dependencies
        working-directory: src/lib
        run: npm ci

      - name: Check package
        working-directory: src/lib
        run: npm run check

      - name: Audit production dependencies
        working-directory: src/lib
        run: npm audit --omit=dev --audit-level=high

      - name: Verify public exports load
        working-directory: src/lib
        run: |
          node --input-type=module <<'NODE'
          const kit = await import('./dist/index.js')
          const expected = [
            'fetchNoteInfo',
            'rotateNote',
            'splitNote',
            'mergeNotes',
            'meltNote',
            'registerUsername',
            'scanForAddressNotes'
          ]
          const missing = expected.filter(name => typeof kit[name] !== 'function')
          if (missing.length) throw new Error(`Missing exports: ${missing.join(', ')}`)
          NODE

      - name: Pack exact release artefact
        id: pack
        working-directory: src/lib
        run: |
          set -euo pipefail
          pack_json="$(npm pack --pack-destination "$RUNNER_TEMP" --json)"
          filename="$(jq -r '.[0].filename' <<<"$pack_json")"
          test -n "$filename"
          test -f "$RUNNER_TEMP/$filename"
          npm publish --dry-run --access public "$RUNNER_TEMP/$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload release artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lnurlcash-kit-package
          path: ${{ runner.temp }}/${{ steps.pack.outputs.filename }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # a custom `if:` replaces the implicit success() check entirely, so
    # build's own outcome must be re-checked explicitly here too - without
    # this, build being skipped (check-changed found nothing to publish)
    # wouldn't stop this job from trying to run anyway and failing when it
    # goes looking for an artefact that was never produced
    if: |
      needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.publish == true)
    runs-on: ubuntu-24.04
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node with npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          registry-url: https://registry.npmjs.org

      - name: Download validated release artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lnurlcash-kit-package
          path: ${{ runner.temp }}/lnurlcash-kit-package

      - name: Publish exact artefact to npm
        env:
          TARBALL: ${{ runner.temp }}/lnurlcash-kit-package/${{ needs.build.outputs.filename }}
        run: npm publish --access public --provenance "$TARBALL"

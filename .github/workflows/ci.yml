name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # full history + tags, so `git describe` (scripts/git-version.mjs)
          # can find the nearest release tag - default checkout is shallow
          # and tag-less
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/lib/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run tsc
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - run: npm ci
        working-directory: src/lib
      - run: npm run check
        working-directory: src/lib
      - run: npm pack --dry-run
        working-directory: src/lib
      # informational only - surfaces newly disclosed advisories without
      # failing an otherwise-green build over an unmaintained transitive dep
      - run: npm audit --audit-level=high
        continue-on-error: true
